<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick TradeIn - ပိုင်ဆိုင်မှု လွှဲပြောင်းနှင့် ပြန်လည်ဝယ်ယူခွင့် စာချုပ်</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
        body { font-family: 'Padauk', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Navigation Bar -->
    <nav class="bg-indigo-900 text-white shadow-md sticky top-0 z-50 no-print">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-arrows-rotate text-emerald-400 text-2xl"></i>
                <span class="text-xl font-bold tracking-wide">Quick TradeIn</span>
            </div>
            <button onclick="window.print()" class="text-sm bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded-lg border border-indigo-600 transition flex items-center gap-2">
                <i class="fa-solid fa-print"></i> စာချုပ် Print ထုတ်မည်
            </button>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 text-white py-10 px-4 text-center">
        <!-- ခေါင်းစီးအား ပိုမိုလေးနက်သော စာသားဖြင့် ပြောင်းလဲထားပါသည် -->
        <h1 class="text-2xl md:text-3xl font-bold">ပိုင်ဆိုင်မှု လွှဲပြောင်းနှင့် ပြန်လည်ဝယ်ယူခွင့် စာချုပ်</h1>
        <p class="text-indigo-200 mt-1 text-sm md:text-base">Quick TradeIn Smart Asset Buy-back Agreement</p>
    </header>

    <!-- Main Form -->
    <main class="max-w-3xl mx-auto px-4 py-8">
        <form id="contractForm" class="bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6 border border-slate-100">
            <h2 class="text-lg font-bold text-indigo-900 border-b pb-3 border-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-file-contract text-indigo-600"></i> ရောင်းချသူနှင့် ပစ္စည်းအချက်အလက်များ
            </h2>

            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ရောင်းသူအမည် *</label>
                    <input type="text" id="sellerName" value="ဦးမောင်မောင်" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">မှတ်ပုံတင်အမှတ် *</label>
                    <input type="text" id="sellerNrc" value="၁၂/လသယ(နိုင်)၀၈၈၇၆၅" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">နေရပ်လိပ်စာ *</label>
                <textarea id="sellerAddress" rows="2" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">1122/B/ဦးချစ်မောင်လမ်း၁၉ရပ်ကွက်</textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">ရောင်းချသည့် ပစ္စည်းအမျိုးအမည်နှင့် စီးရီးနံပါတ် *</label>
                <input type="text" id="itemName" value="VIVO Phone 1048" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ရောင်းချသည့် ပမာဏ (ကျပ်) *</label>
                    <input type="number" id="payoutAmount" value="100000" oninput="calculateDetails()" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ရောင်းချသည့်နေ့စွဲ *</label>
                    <input type="date" id="tradeDate" onchange="calculateDetails()" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <!-- အလိုအလျောက် တွက်ချက်သည့် အပိုင်း -->
            <div class="bg-indigo-50/70 p-4 rounded-xl space-y-2 border border-indigo-100">
                <div class="flex justify-between text-sm">
                    <span class="text-slate-600">ဝန်ဆောင်ခ (၈%):</span>
                    <span id="feeDisplay" class="font-bold text-slate-800">၈,၀၀၀ ကျပ်</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-600">ပြန်လည်ဝယ်ယူရန် နောက်ဆုံးရက် (ရက်ပေါင်း ၃၀):</span>
                    <span id="dueDateDisplay" class="font-bold text-slate-800">2026-09-06</span>
                </div>
                <div class="flex justify-between text-base font-bold text-indigo-900 pt-2 border-t border-indigo-200">
                    <span>စုစုပေါင်း ပြန်လည်ဝယ်ယူရမည့် ငွေပမာဏ:</span>
                    <span id="totalDisplay" class="text-emerald-600">၁၀၈,၀၀၀ ကျပ်</span>
                </div>
            </div>

            <!-- လွယ်ကူသော Digital Consent/Signature အပိုင်း -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                <label class="block text-sm font-bold text-slate-800">ရောင်းသူ၏ သဘောတူညီချက် အတည်ပြုခြင်း *</label>
                
                <div class="flex items-start gap-3">
                    <input type="checkbox" id="agreeConsent" required class="mt-1 w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500">
                    <label for="agreeConsent" class="text-xs text-slate-600 leading-relaxed">
                        အထက်ပါ ဖော်ပြပါ အချက်အလက်များ၊ ဝန်ဆောင်ခ ၈% နှင့် ရက်ပေါင်း (၃၀) အတွင်း ပြန်လည်ဝယ်ယူရမည့် စည်းကမ်းချက်များကို အပြည့်အဝ နားလည်သဘောတူပါသဖြင့် အီလက်ထရောနစ် စာချုပ်အဖြစ် အတည်ပြုပါသည်-
                    </label>
                </div>

                <div>
                    <input type="text" id="typedSignature" placeholder="ရောင်းသူ အမည်အပြည့်အစုံ ပြန်လည်ရိုက်ထည့်ပါ" required class="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none bg-white">
                </div>
            </div>

            <!-- ပြင်ဆင်ထားသော သိမ်းဆည်းမည် ခလုတ် -->
            <div class="space-y-3 no-print">
                <button type="submit" id="submitBtn" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-3.5 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> စာချုပ်အား သိမ်းဆည်းမည်
                </button>
            </div>
        </form>
    </main>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB04ep1qXo2p9ZHzjtzO9f7ewrTE9Zhjo0",
            authDomain: "quick-tradein-app.firebaseapp.com",
            databaseURL: "https://quick-tradein-app-default-rtdb.firebaseio.com",
            projectId: "quick-tradein-app",
            storageBucket: "quick-tradein-app.firebasestorage.app",
            messagingSenderId: "1045062546373",
            appId: "1:1045062546373:web:ef23268eaa76330daa91ac",
            measurementId: "G-PYWJ781099"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('tradeDate').valueAsDate = new Date();

        window.calculateDetails = () => {
            const amount = parseFloat(document.getElementById('payoutAmount').value) || 0;
            const fee = amount * 0.08;
            const total = amount + fee;

            document.getElementById('feeDisplay').innerText = fee.toLocaleString() + ' ကျပ်';
            document.getElementById('totalDisplay').innerText = total.toLocaleString() + ' ကျပ်';

            const tradeDateVal = document.getElementById('tradeDate').value;
            if (tradeDateVal) {
                const date = new Date(tradeDateVal);
                date.setDate(date.getDate() + 30);
                document.getElementById('dueDateDisplay').innerText = date.toISOString().split('T')[0];
            }
        };

        document.getElementById('contractForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> သိမ်းဆည်းနေပါသည်...';

            try {
                const amount = parseFloat(document.getElementById('payoutAmount').value);
                const fee = amount * 0.08;

                const docRef = await addDoc(collection(db, "contracts"), {
                    sellerName: document.getElementById('sellerName').value,
                    sellerNrc: document.getElementById('sellerNrc').value,
                    sellerAddress: document.getElementById('sellerAddress').value,
                    itemName: document.getElementById('itemName').value,
                    payoutAmount: amount,
                    feeAmount: fee,
                    totalBuybackAmount: amount + fee,
                    tradeDate: document.getElementById('tradeDate').value,
                    dueDate: document.getElementById('dueDateDisplay').innerText,
                    typedSignature: document.getElementById('typedSignature').value,
                    status: "ACTIVE",
                    createdAt: serverTimestamp()
                });

                alert('စာချုပ်အချက်အလက်များကို အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ။ စာချုပ် ID: ' + docRef.id);
                window.print(); // သိမ်းပြီးသည်နှင့် စာချုပ်အား Print/PDF ထုတ်ရန် တိုက်ရိုက်ပွင့်လာပါမည်
            } catch (error) {
                alert("အမှားအယွင်းရှိပါသည်: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> စာချုပ်အား သိမ်းဆည်းမည်';
            }
        });
    </script>
</body>
                        </html>
